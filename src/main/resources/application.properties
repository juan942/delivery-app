spring.application.name=delivery-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mi_base_datos}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

server.port=8080

management.endpoints.web.exposure.include=health,info

app.upload-dir=${UPLOAD_DIR:uploads}
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-by-encript-security-access-token}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
